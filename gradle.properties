# Gradle / JVM
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Mappings (default: official Mojang mappings).
# Parchment にアップグレードする場合は docs/03-Modの基本.md を参照。
mapping_channel=official
mapping_version=1.20.1

# Minecraft / Forge versions (検証済み: 1.20.1 / Forge 47.4.10 = Recommended)
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)

# Mod metadata (mods.toml にトークン置換される)
mod_id=examplemod
mod_name=Example Mod
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.example.examplemod
mod_authors=YourName
mod_description=Forge 1.20.1 の最小スキャフォールド。自律的な Mod 開発の出発点。
